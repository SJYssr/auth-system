# 后端/前端 lint 与单元测试 + 两个纯 API 套件 + 四个 Playwright UI 冒烟套件。
# API 套件与 UI 套件用不同 job 隔离：避免共享 /login 限流窗口（5 次/分钟/IP）互相挤占。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 安装后端依赖
        run: npm ci --prefix server

      - name: ESLint
        run: npm run lint --prefix server

      - name: 单元测试（纯函数，无需数据库）
        run: npm test --prefix server

      - name: 前端单元测试（vitest）
        run: |
          npm ci --prefix client
          npm test --prefix client

  api-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test-card-flow.js, test-api.js]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e_test_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pe2e_test_root"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 导入数据库 schema
        run: mysql -h 127.0.0.1 -uroot -pe2e_test_root < server/schema.sql

      - name: 预置 test-api 数据
        if: matrix.suite == 'test-api.js'
        run: mysql -h 127.0.0.1 -uroot -pe2e_test_root auth-system < e2e-test/seed-api-test.sql

      - name: 安装后端依赖
        run: npm ci --prefix server

      - name: 安装测试依赖
        run: npm ci --prefix e2e-test

      - name: 安装前端依赖并构建
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: 启动后端
        run: |
          cd server
          PORT=3100 DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root \
            DB_PASSWORD=e2e_test_root DB_NAME=auth-system \
            CARD_PEPPER=c2a9f1e2d3c4b5a6978877665544332211ffeeddccbbaa9988776655443322110 \
            INITIAL_ADMIN_USERNAME=e2e_admin INITIAL_ADMIN_PASSWORD=e2e-admin-password-2026 \
            nohup node src/index.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/health && break
            sleep 1
          done
          curl -sf http://localhost:3100/health > /dev/null || (cat /tmp/server.log && exit 1)

      - name: 运行 ${{ matrix.suite }}
        run: node e2e-test/${{ matrix.suite }}
        env:
          E2E_BASE: http://localhost:3100
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: e2e_test_root
          DB_NAME: auth-system

  ui-smoke:
    # UI 冒烟：Playwright 走真实前端构建产物。登录态用 admin-seed.js 的确定性 token 注入
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e_test_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pe2e_test_root"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 导入数据库 schema 与 UI 种子
        run: |
          mysql -h 127.0.0.1 -uroot -pe2e_test_root < server/schema.sql
          mysql -h 127.0.0.1 -uroot -pe2e_test_root auth-system < e2e-test/seed-ui-test.sql

      - name: 安装依赖
        run: |
          npm ci --prefix server
          npm ci --prefix e2e-test
          npm ci --prefix client

      - name: 构建前端
        run: npm run build --prefix client

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e-test

      - name: 预置测试管理员
        run: |
          node e2e-test/admin-seed.js create
          node e2e-test/admin-seed.js create-normal
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: e2e_test_root
          DB_NAME: auth-system

      - name: 启动后端
        run: |
          cd server
          PORT=3100 DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root \
            DB_PASSWORD=e2e_test_root DB_NAME=auth-system \
            CARD_PEPPER=c2a9f1e2d3c4b5a6978877665544332211ffeeddccbbaa9988776655443322110 \
            INITIAL_ADMIN_USERNAME=e2e_admin INITIAL_ADMIN_PASSWORD=e2e-admin-password-2026 \
            nohup node src/index.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/health && break
            sleep 1
          done
          curl -sf http://localhost:3100/health > /dev/null || (cat /tmp/server.log && exit 1)

      # 每个套件末尾的登出会清空种子 token，因此套件间重新种子
      - name: 运行 UI 冒烟套件
        run: |
          node e2e-test/admin-seed.js create && node e2e-test/admin-seed.js create-normal
          node e2e-test/test-public.js
          node e2e-test/admin-seed.js create && node e2e-test/admin-seed.js create-normal
          node e2e-test/test-admin.js
          node e2e-test/admin-seed.js create && node e2e-test/admin-seed.js create-normal
          node e2e-test/test-admins-page.js
          node e2e-test/admin-seed.js create && node e2e-test/admin-seed.js create-normal
          node e2e-test/test-permissions.js
        env:
          E2E_BASE: http://localhost:3100
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: e2e_test_root
          DB_NAME: auth-system
